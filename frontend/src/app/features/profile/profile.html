<div class="profile-container">
  <mat-card class="profile-card">
    <div class="header-image">
      <div class="avatar-circle">
        <mat-icon>person</mat-icon>
      </div>
    </div>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="center">

      <!-- 1. SEKME: Profil Bilgileri -->
      <mat-tab label="Profil Bilgileri">
        <form [formGroup]="infoForm" (ngSubmit)="updateInfo()" class="tab-content">

          <div class="row">
            <mat-form-field appearance="outline" class="half">
              <mat-label>Ad</mat-label>
              <input matInput formControlName="firstName">
            </mat-form-field>
            <mat-form-field appearance="outline" class="half">
              <mat-label>Soyad</mat-label>
              <input matInput formControlName="lastName">
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="full">
            <mat-label>E-Posta</mat-label>
            <input matInput formControlName="email">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Telefon</mat-label>
            <input matInput formControlName="phone" appPhoneMask>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="infoForm.invalid">
            GÜNCELLE
          </button>
        </form>
      </mat-tab>

      <!-- 2. SEKME: Şifre Değiştir -->
      <mat-tab label="Şifre Değiştir">
        <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" class="tab-content">

          <mat-form-field appearance="outline" class="full">
            <mat-label>Mevcut Şifre</mat-label>
            <input matInput type="password" formControlName="currentPassword">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Yeni Şifre</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword">
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Yeni Şifre (Tekrar)</mat-label>
            <input matInput type="password" formControlName="confirmPassword">
          </mat-form-field>

          <button mat-raised-button color="warn" type="submit" [disabled]="passwordForm.invalid">
            ŞİFREYİ DEĞİŞTİR
          </button>
        </form>
      </mat-tab>

    </mat-tab-group>
  </mat-card>
</div>
