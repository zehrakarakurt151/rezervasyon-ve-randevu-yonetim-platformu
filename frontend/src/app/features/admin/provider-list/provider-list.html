<div class="page-container">
    <div class="header">
      <h1>Hizmet Sağlayıcı Yönetimi</h1>
    </div>
  
    <mat-card class="table-card">
      <table mat-table [dataSource]="dataSource">
  
        <!-- No -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> No </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>
  
        <!-- İşletme Bilgisi -->
        <ng-container matColumnDef="businessName">
          <th mat-header-cell *matHeaderCellDef> İşletme / Sahibi </th>
          <td mat-cell *matCellDef="let element"> 
            <div class="business-info">
                <span class="b-name">{{element.businessName}}</span>
                <span class="o-name">{{element.ownerName}}</span>
            </div>
          </td>
        </ng-container>
  
        <!-- Kategori -->
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef> Kategori </th>
          <td mat-cell *matCellDef="let element"> 
            <mat-chip>{{element.category}}</mat-chip>
          </td>
        </ng-container>
  
        <!-- Puan (Yıldızlı) -->
        <ng-container matColumnDef="rating">
          <th mat-header-cell *matHeaderCellDef> Puan </th>
          <td mat-cell *matCellDef="let element"> 
            <div class="rating-box">
                <mat-icon class="star">star</mat-icon>
                <span>{{element.rating}}</span>
            </div>
          </td>
        </ng-container>
  
        <!-- Durum (Slide Toggle) -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Durum </th>
          <td mat-cell *matCellDef="let element">
            <mat-slide-toggle 
                [checked]="element.isApproved" 
                (change)="toggleApproval(element)"
                color="primary">
                {{ element.isApproved ? 'Onaylı' : 'Bekliyor' }}
            </mat-slide-toggle>
          </td>
        </ng-container>
  
        <!-- İşlemler -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Detay </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="accent">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card>
  </div>
