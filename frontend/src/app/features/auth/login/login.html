<div class="login-container">
  <mat-card class="login-card">

    <!-- Logo/Başlık Alanı -->
    <div class="logo-section">
      <div class="logo-icon">
        <mat-icon>calendar_month</mat-icon>
      </div>
      <h1 class="app-title">Rezervasyon ve Randevu Platformu</h1>
      <p class="app-subtitle">Hesabınıza giriş yapın</p>
    </div>

    <!-- Form Alanı -->
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <!-- E-Posta Kutusu -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-Posta Adresi</mat-label>
          <input matInput formControlName="email" placeholder="ornek@email.com">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">E-posta gereklidir</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Geçersiz format</mat-error>
        </mat-form-field>

        <!-- Şifre Kutusu -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Şifre</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">En az 6 karakter olmalı</mat-error>
        </mat-form-field>

        <!-- Giriş Butonu -->
        <button mat-raised-button class="submit-btn" type="submit" [disabled]="loginForm.invalid">
          <mat-icon>login</mat-icon>
          Giriş Yap
        </button>

        <!-- Kayıt Linki -->
        <div class="register-link">
          <span>Hesabınız yok mu?</span>
          <a routerLink="/register">Kayıt Ol</a>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
